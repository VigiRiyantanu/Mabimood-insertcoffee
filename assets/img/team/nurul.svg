<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nurulBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C1F33"/>
      <stop offset="60%" stop-color="#19121E"/>
      <stop offset="100%" stop-color="#0E0A12"/>
    </linearGradient>

    <!-- Purple Trim Gradient -->
    <linearGradient id="nurulPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBBBEF"/>
      <stop offset="50%" stop-color="#8E7BB8"/>
      <stop offset="100%" stop-color="#554477"/>
    </linearGradient>

    <!-- Scarf Gradient -->
    <linearGradient id="nurulScarf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6F5D8E"/>
      <stop offset="100%" stop-color="#4B3B66"/>
    </linearGradient>

    <!-- Strict Circular Clip Path -->
    <clipPath id="avatarCircleClip">
      <circle cx="100" cy="100" r="95"/>
    </clipPath>
  </defs>

  <!-- Group clipped to perfect circle -->
  <g clip-path="url(#avatarCircleClip)">
    <!-- Background -->
    <rect width="200" height="200" fill="url(#nurulBg)"/>
    <circle cx="100" cy="80" r="85" fill="#8E7BB8" opacity="0.1"/>

    <!-- Shoulders & Lower Hijab -->
    <path d="M 20 200 C 25 142, 60 130, 100 130 C 140 130, 175 142, 180 200 Z" fill="url(#nurulScarf)"/>
    <path d="M 68 135 Q 100 160 132 135" stroke="#8E7BB8" stroke-width="2" fill="none"/>
    <path d="M 85 142 L 100 195 L 115 142" stroke="#554477" stroke-width="1.5" fill="none"/>

    <!-- Hijab Outer Wrap (Draped Elegance) -->
    <path d="M 54 94 C 50 48, 150 48, 146 94 C 144 130, 128 144, 100 144 C 72 144, 56 130, 54 94 Z" fill="url(#nurulScarf)"/>

    <!-- Inner Underscarf (Band) -->
    <path d="M 69 82 Q 100 70 131 82 Q 100 64 69 82 Z" fill="#3D2D52"/>

    <!-- Face Area -->
    <ellipse cx="100" cy="94" rx="31" ry="36" fill="#F0C3A2"/>

    <!-- Soft Cheeks -->
    <ellipse cx="78" cy="99" rx="6" ry="4" fill="#E89A88" opacity="0.35"/>
    <ellipse cx="122" cy="99" rx="6" ry="4" fill="#E89A88" opacity="0.35"/>

    <!-- Eyebrows -->
    <path d="M 77 82 Q 87 78 93 82" stroke="#3D251A" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M 107 82 Q 113 78 123 82" stroke="#3D251A" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <!-- Expressive Eyes with Highlights -->
    <ellipse cx="85" cy="89" rx="4" ry="4.5" fill="#241510"/>
    <ellipse cx="115" cy="89" rx="4" ry="4.5" fill="#241510"/>
    <circle cx="86.5" cy="87.5" r="1.6" fill="#FFFFFF"/>
    <circle cx="116.5" cy="87.5" r="1.6" fill="#FFFFFF"/>
    <circle cx="84" cy="91" r="0.8" fill="#FFFFFF"/>
    <circle cx="114" cy="91" r="0.8" fill="#FFFFFF"/>

    <!-- Eyelashes subtle touch -->
    <path d="M 81 86 L 78 84" stroke="#241510" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 119 86 L 122 84" stroke="#241510" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M 99 92 L 97 98 L 102 98" stroke="#D18F6E" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Friendly Smile -->
    <path d="M 91 108 Q 100 116 109 108" stroke="#9A4E38" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Hijab Pin / Subtle Aesthetic Accent -->
    <circle cx="66" cy="118" r="3.5" fill="#CBBBEF" stroke="#3D2D52" stroke-width="1"/>
  </g>

  <!-- Crisp Outer Ring Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#nurulPurple)" stroke-width="5"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
</svg>
