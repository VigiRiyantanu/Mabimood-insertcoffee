<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fahmiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2B23"/>
      <stop offset="60%" stop-color="#101C16"/>
      <stop offset="100%" stop-color="#08100C"/>
    </linearGradient>

    <!-- Green/Cyan Trim Gradient -->
    <linearGradient id="fahmiGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CE8A9"/>
      <stop offset="50%" stop-color="#4EAF72"/>
      <stop offset="100%" stop-color="#236B42"/>
    </linearGradient>

    <!-- Hoodie Gradient -->
    <linearGradient id="fahmiHoodie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2E25"/>
      <stop offset="100%" stop-color="#0E1712"/>
    </linearGradient>

    <!-- Strict Circular Clip Path -->
    <clipPath id="avatarCircleClip">
      <circle cx="100" cy="100" r="95"/>
    </clipPath>
  </defs>

  <!-- Group clipped to perfect circle -->
  <g clip-path="url(#avatarCircleClip)">
    <!-- Background -->
    <rect width="200" height="200" fill="url(#fahmiBg)"/>
    <circle cx="100" cy="80" r="85" fill="#4EAF72" opacity="0.08"/>

    <!-- Shoulders / Hoodie -->
    <path d="M 20 200 C 25 142, 60 132, 100 132 C 140 132, 175 142, 180 200 Z" fill="url(#fahmiHoodie)"/>
    <!-- Hoodie V-Neck & Strings -->
    <path d="M 80 133 L 100 156 L 120 133 Z" fill="#2E4738"/>
    <line x1="94" y1="154" x2="92" y2="175" stroke="#4EAF72" stroke-width="2" stroke-linecap="round"/>
    <line x1="106" y1="154" x2="108" y2="175" stroke="#4EAF72" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="88" y="104" width="24" height="30" rx="4" fill="#DCA477"/>

    <!-- Ears -->
    <circle cx="63" cy="88" r="9" fill="#DCA477"/>
    <circle cx="137" cy="88" r="9" fill="#DCA477"/>

    <!-- Face -->
    <ellipse cx="100" cy="88" rx="35" ry="40" fill="#EAB992"/>

    <!-- Headset Around Neck (Modern Developer Style) -->
    <path d="M 64 116 C 68 138, 132 138, 136 116" stroke="#253A2E" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="58" y="106" width="16" height="22" rx="6" fill="#365443" stroke="#4EAF72" stroke-width="2"/>
    <rect x="126" y="106" width="16" height="22" rx="6" fill="#365443" stroke="#4EAF72" stroke-width="2"/>

    <!-- Hair Back/Sides -->
    <path d="M 63 80 C 60 48, 76 40, 100 40 C 124 40, 140 48, 137 80 C 128 66, 116 62, 100 62 C 84 62, 72 66, 63 80 Z" fill="#171916"/>
    
    <!-- Modern Spiky/Textured Hair Cut -->
    <path d="M 66 74 C 64 50, 78 38, 92 36 C 96 30, 106 30, 114 36 C 126 36, 136 46, 134 72 C 128 58, 120 54, 110 54 C 102 54, 98 48, 88 52 C 78 56, 72 62, 66 74 Z" fill="#242B23"/>
    <path d="M 88 38 Q 98 28 108 34" stroke="#4EAF72" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Eyebrows -->
    <path d="M 76 75 Q 86 71 93 75" stroke="#171916" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 107 75 Q 114 71 124 75" stroke="#171916" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Sharp Eyes with Highlights -->
    <ellipse cx="85" cy="84" rx="4" ry="4.5" fill="#171916"/>
    <ellipse cx="115" cy="84" rx="4" ry="4.5" fill="#171916"/>
    <circle cx="86.5" cy="82.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="116.5" cy="82.5" r="1.5" fill="#FFFFFF"/>

    <!-- Nose -->
    <path d="M 98 88 L 96 95 L 102 95" stroke="#C48E66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cheerful Smile -->
    <path d="M 90 105 Q 100 114 110 105" stroke="#944B27" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Crisp Outer Ring Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#fahmiGreen)" stroke-width="5"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
</svg>
