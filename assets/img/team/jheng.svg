<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="jhengBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#302316"/>
      <stop offset="60%" stop-color="#1C140D"/>
      <stop offset="100%" stop-color="#0E0A06"/>
    </linearGradient>

    <!-- Amber Trim Gradient -->
    <linearGradient id="jhengAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1A9"/>
      <stop offset="50%" stop-color="#E29F44"/>
      <stop offset="100%" stop-color="#9C6219"/>
    </linearGradient>

    <!-- Shirt Gradient -->
    <linearGradient id="jhengShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D2E21"/>
      <stop offset="100%" stop-color="#1C150F"/>
    </linearGradient>

    <!-- Strict Circular Clip Path -->
    <clipPath id="avatarCircleClip">
      <circle cx="100" cy="100" r="95"/>
    </clipPath>
  </defs>

  <!-- Group clipped to perfect circle -->
  <g clip-path="url(#avatarCircleClip)">
    <!-- Background -->
    <rect width="200" height="200" fill="url(#jhengBg)"/>
    <circle cx="100" cy="80" r="85" fill="#E29F44" opacity="0.08"/>

    <!-- Shoulders / Streetwear Jacket -->
    <path d="M 20 200 C 25 142, 60 132, 100 132 C 140 132, 175 142, 180 200 Z" fill="url(#jhengShirt)"/>
    <!-- Collar Accent -->
    <path d="M 76 133 L 100 160 L 124 133" stroke="#E29F44" stroke-width="2.5" fill="none"/>
    <path d="M 88 145 L 100 185 L 112 145" stroke="#9C6219" stroke-width="1.5" fill="none"/>

    <!-- Neck -->
    <rect x="88" y="104" width="24" height="30" rx="4" fill="#D99E6E"/>

    <!-- Ears -->
    <circle cx="63" cy="88" r="9" fill="#D99E6E"/>
    <circle cx="137" cy="88" r="9" fill="#D99E6E"/>

    <!-- Face -->
    <ellipse cx="100" cy="89" rx="36" ry="41" fill="#E8B588"/>

    <!-- Backward Retro Cap (Main Crown) -->
    <path d="M 62 72 C 63 42, 137 42, 138 72 Z" fill="#D49339"/>
    <!-- Cap Brim Facing Backward -->
    <path d="M 54 72 C 54 68, 100 64, 146 72 C 148 76, 142 80, 136 78 L 64 78 Z" fill="#9C6219"/>
    <path d="M 68 56 Q 100 48 132 56" stroke="#FCE1A9" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Hair Strands Peeking Out -->
    <path d="M 62 76 C 60 84, 62 90, 64 94" stroke="#1A130D" stroke-width="3" stroke-linecap="round"/>
    <path d="M 138 76 C 140 84, 138 90, 136 94" stroke="#1A130D" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M 76 77 Q 86 73 93 77" stroke="#1A130D" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M 107 77 Q 114 73 124 77" stroke="#1A130D" stroke-width="2.8" fill="none" stroke-linecap="round"/>

    <!-- Cheerful Eyes with Highlights -->
    <ellipse cx="85" cy="85" rx="4" ry="4.5" fill="#1A130D"/>
    <ellipse cx="115" cy="85" rx="4" ry="4.5" fill="#1A130D"/>
    <circle cx="86.5" cy="83.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="116.5" cy="83.5" r="1.5" fill="#FFFFFF"/>

    <!-- Nose -->
    <path d="M 98 89 L 96 96 L 102 96" stroke="#C48958" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wide Warm Smile with Dimples -->
    <path d="M 88 106 Q 100 116 112 106" stroke="#8E4822" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <circle cx="85" cy="104" r="1.8" fill="#8E4822" opacity="0.6"/>
    <circle cx="115" cy="104" r="1.8" fill="#8E4822" opacity="0.6"/>
  </g>

  <!-- Crisp Outer Ring Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#jhengAmber)" stroke-width="5"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
</svg>
